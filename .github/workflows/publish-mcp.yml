name: Publish @getconviction/mcp

# Tag-gated npm publish. Never moves funds (ADR 0014).
# Create a tag after merge: git tag mcp-v1.0.0 && git push origin mcp-v1.0.0

on:
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Publish with --dry-run only"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build --workspace @getconviction/mcp
      - run: npm test --workspace @getconviction/mcp
      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --workspace @getconviction/mcp --dry-run --access public
          else
            npm publish --workspace @getconviction/mcp --access public
          fi
